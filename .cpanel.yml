---
deployment:
  tasks:
    - export DEPLOYPATH=/home/puzo3938/public_html/
    - export APPROOT="$HOME/xragency"
    - git restore -- src/routeTree.gen.ts
    - rm -rf "$APPROOT/tmp" "$HOME/tmp"
    - npm install --include=dev --no-package-lock --legacy-peer-deps
    - NITRO_PRESET=node_server npm run build
    - rm -rf "$HOME/.output"
    - /bin/cp -R .output "$HOME/.output"
    - /bin/cp -f app.js "$HOME/app.js"
    - mkdir -p "$HOME/tmp" "$APPROOT/tmp"
    - touch "$HOME/tmp/restart.txt"
    - touch "$APPROOT/tmp/restart.txt"
    - /bin/cp -R .output/public/. "$DEPLOYPATH"
