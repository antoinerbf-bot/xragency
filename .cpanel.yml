---
deployment:
  tasks:
    - export DEPLOYPATH=/home/puzo3938/public_html/
    - export APPROOT="$HOME/repositories/xragency"
    - cd "$APPROOT"
    - git restore -- src/routeTree.gen.ts
    - rm -rf "$APPROOT/tmp" "$HOME/tmp" "$APPROOT/.output" "$HOME/.output"
    - npm install --include=dev --no-package-lock --legacy-peer-deps --no-audit --no-fund
    - NITRO_PRESET=node_server npm run build
    - git restore -- src/routeTree.gen.ts
    - /bin/cp -R "$APPROOT/.output" "$HOME/.output"
    - /bin/cp -f "$APPROOT/app.js" "$HOME/app.js"
    - mkdir -p "$HOME/tmp" "$APPROOT/tmp"
    - touch "$HOME/tmp/restart.txt"
    - touch "$APPROOT/tmp/restart.txt"
    - /bin/cp -R "$APPROOT/.output/public/." "$DEPLOYPATH"
